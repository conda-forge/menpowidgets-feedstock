{% set name = "menpowidgets" %}
{% set version = "0.4.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/menpowidgets-{{ version }}.tar.gz
  sha256: 3362b0aa6f8628858eeae89e606f644b0da3064291b88334405d87165a877dc6

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 1

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - menpo >=0.11
    - ipywidgets
    - ipyevents
    - nest-asyncio

test:
  imports:
    - menpowidgets
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: Menpo's Jupyter widgets for fancy visualization
  license: BSD-3-Clause
  license_file: LICENSE.txt
  home: menpo.og

extra:
  recipe-maintainers:
    - patricksnape
